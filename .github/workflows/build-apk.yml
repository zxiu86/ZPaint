name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Advanced Multi-tier GitHub Cache for Ultra-Fast Builds
      - name: Cache Gradle Dependencies & Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore persistent unified keystores (release & debug)
        run: |
          # Restore permanent release keystore
          if [ -f release.keystore.base64 ]; then
            base64 -d release.keystore.base64 > release.keystore
          fi

          # Restore debug keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Extract Application Version
        id: get_version
        run: |
          APP_VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$APP_VER" ]; then
            APP_VER="1.3.2"
          fi
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "Extracted App Version: $APP_VER"

      - name: Build Android APKs (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Direct Unzipped APKs
        run: |
          mkdir -p release-artifacts
          # Copy release APK with explicit version name for direct download
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk release-artifacts/ZPaint-v${{ env.APP_VERSION }}.apk
          fi
          if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/debug/*.apk release-artifacts/ZPaint-v${{ env.APP_VERSION }}-debug.apk
          fi
          ls -la release-artifacts/

      - name: Upload Direct Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZPaint-v${{ env.APP_VERSION }}-Direct-APK
          path: release-artifacts/ZPaint-v${{ env.APP_VERSION }}.apk
          if-no-files-found: warn

      - name: Create GitHub Release with Direct APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release != false)
        uses: softprops/action-gh-release@v2
        with:
          name: ZPaint v${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          body: |
            تطبيق أندرويد خاص بالرسم و الصور

            الإصدار: v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-artifacts/ZPaint-v${{ env.APP_VERSION }}.apk
            release-artifacts/ZPaint-v${{ env.APP_VERSION }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
